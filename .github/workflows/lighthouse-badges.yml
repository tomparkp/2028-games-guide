name: Lighthouse badges

# Runs Lighthouse against production and publishes the README badges to the
# `badges` branch. Called by the release workflow after each deploy, and on a
# weekly schedule so the badges track the live site between releases.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  badges:
    runs-on: ubuntu-latest
    concurrency:
      group: lighthouse-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      # Mobile Lighthouse (default throttling) against the live site, median of 3 runs.
      - run: pnpm dlx @lhci/cli@0.15.1 collect --config=lighthouserc.production.json
      - run: node scripts/lighthouse-badges.mjs .lighthouseci badges
      # Single-commit orphan branch, force-pushed, so badge updates never touch `main`
      # history or show up in Release Please changelogs.
      - name: Publish to badges branch
        working-directory: badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add .
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: update lighthouse badges"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
